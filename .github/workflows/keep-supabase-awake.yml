name: Keep Supabase awake

# Supabase pauses a free project after 7 days without activity. This reads one
# inventory row every day, which counts as activity. If the read fails (for
# example the project is already paused), the run fails and GitHub emails you.

on:
  schedule:
    - cron: "0 3 * * *"   # 08:30 IST, every day
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row from Supabase
        env:
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail-with-body -sS --retry 3 --retry-delay 10 \
            "https://kjogiqwtyrwqxiqcibat.supabase.co/rest/v1/inventory?select=item_id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY"

  # GitHub switches off scheduled workflows in a public repo after 60 days without
  # commits. Re-enabling this workflow on every run resets that clock.
  keepalive:
    needs: ping
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow enable keep-supabase-awake.yml -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
