name: Keep Supabase awake

# Supabase pauses a free project after 7 days without activity. A daily read
# alone was not enough (a pause warning arrived anyway), so this also writes a
# timestamp through public.keepalive(), defined in supabase/keepalive.sql.
# If either call fails (for example the project is already paused), the run
# fails and GitHub emails you.

on:
  schedule:
    - cron: "0 3,15 * * *"   # 08:30 and 20:30 IST, every day
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      URL: https://kjogiqwtyrwqxiqcibat.supabase.co/rest/v1
      KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Write a heartbeat to Supabase
        run: |
          curl --fail-with-body -sS --retry 3 --retry-delay 10 -X POST \
            "$URL/rpc/keepalive" -H "Content-Type: application/json" -d '{}' \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY"

      - name: Read one row from Supabase
        run: |
          curl --fail-with-body -sS --retry 3 --retry-delay 10 \
            "$URL/inventory?select=item_id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY"

  # GitHub switches off scheduled workflows in a public repo after 60 days without
  # commits. Re-enabling this workflow on every run resets that clock.
  keepalive:
    needs: ping
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow enable keep-supabase-awake.yml -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
